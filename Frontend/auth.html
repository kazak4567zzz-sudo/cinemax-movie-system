<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход и регистрация — CineMax</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <style>
    .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 30% 50%, rgba(229,9,20,0.08) 0%, transparent 60%), var(--bg-primary); }
    .auth-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px;
      padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    .auth-logo { font-size: 32px; font-weight: 900; color: var(--accent); text-align: center; margin-bottom: 8px; }
    .auth-logo span { color: var(--text-primary); }
    .auth-subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 32px; }
    .auth-tabs { display: flex; background: var(--bg-card); border-radius: 10px; padding: 4px; margin-bottom: 28px; }
    .auth-tab { flex: 1; text-align: center; padding: 10px; border-radius: 8px; cursor: pointer;
      font-size: 14px; font-weight: 600; color: var(--text-muted); transition: all 0.2s; border: none; background: none; }
    .auth-tab.active { background: var(--accent); color: #fff; }
    .auth-input-group { margin-bottom: 16px; }
    .auth-input-group label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
    .auth-input { width: 100%; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 16px; color: var(--text-primary); font-size: 14px; transition: all 0.2s; outline: none; }
    .auth-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(229,9,20,0.15); }
    .auth-input::placeholder { color: var(--text-muted); }
    .auth-input-icon { position: relative; }
    .auth-input-icon .auth-input { padding-left: 42px; }
    .auth-input-icon i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .btn-auth { width: 100%; background: var(--accent); border: none; border-radius: 10px; padding: 13px;
      color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(229,9,20,0.35); margin-top: 4px; }
    .btn-auth:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(229,9,20,0.45); }
    .btn-auth:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .auth-divider { text-align: center; color: var(--text-muted); font-size: 12px; margin: 20px 0; position: relative; }
    .auth-divider::before, .auth-divider::after { content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: var(--border); }
    .auth-divider::before { left: 0; }
    .auth-divider::after { right: 0; }
    .auth-error { background: rgba(229,9,20,0.1); border: 1px solid rgba(229,9,20,0.3); border-radius: 8px;
      padding: 10px 14px; color: #ff6b6b; font-size: 13px; margin-bottom: 16px; display: none; }
    .auth-success { background: rgba(70,211,105,0.1); border: 1px solid rgba(70,211,105,0.3); border-radius: 8px;
      padding: 10px 14px; color: var(--green); font-size: 13px; margin-bottom: 16px; display: none; }
    .password-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); cursor: pointer; border: none; background: none; padding: 0; }
    .password-toggle:hover { color: var(--text-primary); }
    .back-home { display: flex; align-items: center; gap: 6px; color: var(--text-muted);
      font-size: 13px; text-decoration: none; margin-bottom: 24px; transition: color 0.2s; }
    .back-home:hover { color: var(--text-primary); }
    .strength-bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; }
    .strength-fill { height: 100%; border-radius: 2px; transition: all 0.3s; width: 0; }
  </style>
</head>
<body>
<div class="auth-page">
  <div style="width:100%;max-width:420px;padding:20px;">
    <a href="index.html" class="back-home"><i class="bi bi-arrow-left"></i> На главную</a>

    <div class="auth-card">
      <div class="auth-logo">CINE<span>MAX</span></div>
      <p class="auth-subtitle" id="authSubtitle">Войдите в свой аккаунт</p>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">
          <i class="bi bi-box-arrow-in-right me-1"></i> Войти
        </button>
        <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">
          <i class="bi bi-person-plus me-1"></i> Регистрация
        </button>
      </div>

      <div id="alertError" class="auth-error"></div>
      <div id="alertSuccess" class="auth-success"></div>

      <!-- LOGIN FORM -->
      <form id="loginForm" onsubmit="doLogin(event)">
        <div class="auth-input-group">
          <label>Email</label>
          <div class="auth-input-icon">
            <i class="bi bi-envelope"></i>
            <input type="email" id="loginEmail" class="auth-input" placeholder="your@email.com" required autocomplete="email">
          </div>
        </div>
        <div class="auth-input-group">
          <label>Password</label>
          <div class="auth-input-icon" style="position:relative;">
            <i class="bi bi-lock"></i>
            <input type="password" id="loginPass" class="auth-input" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="password-toggle" onclick="togglePass('loginPass',this)"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <button type="submit" class="btn-auth" id="loginBtn">
          <i class="bi bi-box-arrow-in-right me-2"></i>Войти
        </button>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" style="display:none;" onsubmit="doRegister(event)">
        <div class="auth-input-group">
          <label>Username</label>
          <div class="auth-input-icon">
            <i class="bi bi-person"></i>
            <input type="text" id="regUsername" class="auth-input" placeholder="Ваше имя" required minlength="3" maxlength="30" autocomplete="username">
          </div>
        </div>
        <div class="auth-input-group">
          <label>Email</label>
          <div class="auth-input-icon">
            <i class="bi bi-envelope"></i>
            <input type="email" id="regEmail" class="auth-input" placeholder="your@email.com" required maxlength="254" autocomplete="email">
          </div>
        </div>
        <div class="auth-input-group">
          <label>Password</label>
          <div class="auth-input-icon" style="position:relative;">
            <i class="bi bi-lock"></i>
            <input type="password" id="regPass" class="auth-input" placeholder="Не менее 8 символов" required minlength="8" maxlength="128" oninput="checkStrength(this.value)" autocomplete="new-password">
            <button type="button" class="password-toggle" onclick="togglePass('regPass',this)"><i class="bi bi-eye"></i></button>
          </div>
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
          <div id="strengthLabel" style="font-size:11px;color:#666;margin-top:4px;"></div>
        </div>
        <div class="auth-input-group">
          <label>Confirm Password</label>
          <div class="auth-input-icon">
            <i class="bi bi-lock-fill"></i>
            <input type="password" id="regPassConfirm" class="auth-input" placeholder="Повторите пароль" required minlength="8" maxlength="128" autocomplete="new-password">
          </div>
        </div>
        <label style="display:flex;gap:9px;align-items:flex-start;color:var(--text-secondary);font-size:12px;margin:4px 0 14px;cursor:pointer;">
          <input type="checkbox" id="regTerms" required style="margin-top:2px;accent-color:var(--accent);">
          <span>Я согласен с правилами сервиса и обработкой данных для создания аккаунта.</span>
        </label>
        <button type="submit" class="btn-auth" id="regBtn">
          <i class="bi bi-person-check me-2"></i>Создать аккаунт
        </button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script>
  if (localStorage.getItem('cinemax_theme') === 'light') document.body.classList.add('light-mode');

  const user = JSON.parse(localStorage.getItem('cinemax_user') || 'null');
  if (user?.token) window.location.href = 'index.html';
  else if (user) localStorage.removeItem('cinemax_user');

  function switchTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('tabLogin').classList.toggle('active', isLogin);
    document.getElementById('tabRegister').classList.toggle('active', !isLogin);
    document.getElementById('loginForm').style.display = isLogin ? '' : 'none';
    document.getElementById('registerForm').style.display = isLogin ? 'none' : '';
    document.getElementById('authSubtitle').textContent = isLogin
      ? 'Войдите в свой аккаунт'
      : 'Создайте аккаунт, чтобы сохранять избранное и отзывы';
    clearAlerts();
  }

  function showError(msg) {
    const el = document.getElementById('alertError');
    el.textContent = msg;
    el.style.display = '';
    document.getElementById('alertSuccess').style.display = 'none';
  }
  function showSuccess(msg) {
    const el = document.getElementById('alertSuccess');
    el.textContent = msg;
    el.style.display = '';
    document.getElementById('alertError').style.display = 'none';
  }
  function clearAlerts() {
    document.getElementById('alertError').style.display = 'none';
    document.getElementById('alertSuccess').style.display = 'none';
  }

  function togglePass(inputId, btn) {
    const input = document.getElementById(inputId);
    const isPass = input.type === 'password';
    input.type = isPass ? 'text' : 'password';
    btn.querySelector('i').className = isPass ? 'bi bi-eye-slash' : 'bi bi-eye';
  }

  function checkStrength(val) {
    const fill = document.getElementById('strengthFill');
    const label = document.getElementById('strengthLabel');
    let score = 0;
    if (val.length >= 8) score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const levels = [
      { w: '20%', c: '#e50914', t: 'Very weak' },
      { w: '40%', c: '#ff6348', t: 'Weak' },
      { w: '60%', c: '#ffa502', t: 'Fair' },
      { w: '80%', c: '#2ed573', t: 'Strong' },
      { w: '100%', c: '#46d369', t: 'Very strong' }
    ];
    const l = levels[Math.min(score, 4)];
    fill.style.width = l.w;
    fill.style.background = l.c;
    label.textContent = val ? l.t : '';
    label.style.color = l.c;
  }

  async function doLogin(e) {
    e.preventDefault();
    clearAlerts();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';
    try {
      const res = await authFetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('loginEmail').value, password: document.getElementById('loginPass').value })
      });
      const data = await readApiResponse(res);
      if (!res.ok) { showError(data.message || 'Login failed'); return; }
      localStorage.setItem('cinemax_user', JSON.stringify(data));
      showSuccess('С возвращением, ' + data.username + '!');
      setTimeout(() => window.location.href = 'index.html', 1200);
    } catch (err) {
      showError('Connection error. Please try again.');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Войти';
    }
  }

  async function doRegister(e) {
    e.preventDefault();
    clearAlerts();
    const pass = document.getElementById('regPass').value;
    const confirm = document.getElementById('regPassConfirm').value;
    if (pass !== confirm) { showError('Пароли не совпадают.'); return; }
    const btn = document.getElementById('regBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';
    try {
      const res = await authFetch('/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: document.getElementById('regUsername').value.trim(), email: document.getElementById('regEmail').value.trim(), password: pass })
      });
      const data = await readApiResponse(res);
      if (!res.ok) { showError(data.message || 'Registration failed'); return; }
      localStorage.setItem('cinemax_user', JSON.stringify(data));
      showSuccess('Аккаунт создан. Добро пожаловать, ' + data.username + '!');
      setTimeout(() => window.location.href = 'index.html', 1400);
    } catch (err) {
      showError('Connection error. Please try again.');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-person-check me-2"></i>Создать аккаунт';
    }
  }

  async function readApiResponse(response) {
    const text = await response.text();
    let data = {};
    try { data = text ? JSON.parse(text) : {}; } catch (_) {}
    if (!response.ok && !data.message) {
      data.message = response.status >= 500
        ? 'Сервис регистрации временно недоступен. Попробуйте немного позже.'
        : 'Не удалось выполнить запрос.';
    }
    return data;
  }

  function authFetch(path, options) {
    return fetch(`${AUTH_API_BASE}${path}`, options);
  }
</script>
</body>
</html>
